    <!-- Hojas de estilo de Bootstrap y Fuentes originales -->

    <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet" />

    <style>
        * {
            margin: 0;
            padding: 0;
            -webkit-box-sizing: border-box;
            -moz-box-sizing: border-box;
            box-sizing: border-box;
        }

        body {
            background-color: #f6f6f6;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        header {
            width: 95%;
            max-width: 1400px;
            margin: auto;
        }

        header nav {
            width: 100%;
            margin: auto;
            background: #202F50;
            z-index: 1000;
        }

        header nav ul {
            list-style: none;
            margin-bottom: 0 !important;
            padding: 0;
        }

        header nav ul li {
            display: inline-block;
            position: relative;
        }

        header nav ul li a {
            color: #fff !important;
            padding: 20px;
            display: block;
            text-decoration: none !important;
            font-size: 14px;
        }

        header nav ul li a span {
            margin-right: 4px;
        }

        header nav ul li:hover {
            background: #32497A;
        }

        .content-titulo {
            margin: 20px 0px 20px 0px;
            display: table;
            width: 100%;
            position: relative;
        }

        .content-titulo > [class*="col-"] {
            float: none;
            display: table-cell;
            vertical-align: middle;
        }

        .content-titulo img {
            width: auto;
            height: 95px;   
        }

        .content-titulo .titulo {
            vertical-align: middle;
            float: left;
        }

        /* TÍTULO BAJADO UN POCO MÁS */
        .content-titulo .titulo h2 {
            color: #202F50;
            margin: 0;
            margin-top: 24px; 
            font-size: 30px;
            font-weight: normal;
        }

        .content-titulo .redes-sociales {
            position: absolute;
            top: 0px;
            right: 0px;
            display: flex;
            align-items: center;
        }

        .btn-facebook-orig {
            background-color: #3b5998;
            color: #ffffff;
            font-weight: bold;
            font-size: 13px;
            padding: 1px 6px;
            border-radius: 2px;
            font-family: Arial, sans-serif;
            text-decoration: none;
        }

        .btn-youtube-orig {
            background-color: #202F50;
            color: #ffffff;
            font-weight: bold;
            font-size: 11px;
            padding: 2px 5px;
            border-radius: 2px;
            font-family: "Arial Black", Gadget, sans-serif;
            text-decoration: none;
        }

        .btn-youtube-orig span {
            color: #cc181e;
        }

        .separador-redes {
            display: inline-block;
            width: 1px;
            height: 18px;
            background-color: #D94141;
            margin: 0 6px;
        }

        .container {
            width: 95% !important;
            padding: 0 !important;
        }

        @media (min-width: 1400px){
            .container {
                width: 1400px !important;
            }
        }

        #dtDatosRegistro {
            margin-top: 0px;
        }

        .alert-success {
            color: #3c763d;
            background-color: #dff0d8;
            border-color: #d6e9c6;
            border-radius: 0px;
            margin-bottom: 20px;
            padding: 15px 20px;
        }

        .alert-success h4.alert-heading {
            font-size: 18px;
            font-weight: normal !important;
            margin-top: 0;
            margin-bottom: 0;
            letter-spacing: 0.3px;
        }

        .alert-success hr {
            border-top-color: #c9e2b3;
            margin-top: 15px;
            margin-bottom: 15px;
        }

        .panel-default {
            border-color: #ddd;
            border-radius: 2px;
            box-shadow: none;
            margin-bottom: 25px;
        }

        .panel-default > .panel-heading {
            color: #333;
            background-color: #f5f5f5;
            border-color: #ddd;
            padding: 10px 15px;
        }

        .panel-body {
            padding: 15px;
            background-color: #fff;
        }

        .table-user-information {
            margin-bottom: 0;
            width: 100%;
        }

        .table-user-information > tbody > tr > td {
            padding: 8px;
            line-height: 1.42857143;
            vertical-align: top;
            border-top: 1px solid #ddd;
            font-size: 14px;
            color: #333;
        }

        .table-user-information > tbody > tr:first-child > td {
            border-top: 1px solid #ddd;
        }

        /* SE QUITA LA LÍNEA INFERIOR DE LA ÚLTIMA FILA (DÍA) */
        .table-user-information > tbody > tr:last-child > td {
            border-bottom: none !important;
            padding-bottom: 8px;
        }

        .table-user-information > tbody > tr > td:first-child {
            width: 20%;
            color: #333;
        }

        /* FRANJA INFERIOR */
        footer.container {
            background-color: #fff;
            padding: 17px 15px !important; 
            margin-top: 15px;
            margin-bottom: 25px;
            text-align: center;
            border-top: 1px solid #e7e7e7;
        }

        footer div p {
            margin: 0 !important;
            font-size: 13px;
            color: #333;
        }

        footer div b {
            color: #202F50;
        }
    </style>
</head>
